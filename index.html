<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haushaltsbuch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haushalt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ECEFE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111816" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#ECEFE9; --surface:#FAFBF8; --surface2:#E1E6DF; --ink:#16211F; --muted:#56655F; --line:#D2D9D1;
  --accent:#1E5A53; --accent-ink:#F3FAF8;
  --out:#963A60; --out-soft:rgba(150,58,96,.13);
  --in:#2A7652; --in-soft:rgba(42,118,82,.13);
  --save:#2C5C9A; --save-soft:rgba(44,92,154,.13);
  --warn:#A3542A;
  --f-display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111816; --surface:#19221F; --surface2:#24302C; --ink:#E5ECE8; --muted:#9BAAA4; --line:#2C3934;
    --accent:#72C3B5; --accent-ink:#0E1C19;
    --out:#E585AA; --out-soft:rgba(229,133,170,.16);
    --in:#71CB9A; --in-soft:rgba(113,203,154,.16);
    --save:#8AAEEA; --save-soft:rgba(138,174,234,.16);
    --warn:#E39A6B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --surface2:#24302C; --ink:#E5ECE8; --muted:#9BAAA4; --line:#2C3934;
  --accent:#72C3B5; --accent-ink:#0E1C19;
  --out:#E585AA; --out-soft:rgba(229,133,170,.16);
  --in:#71CB9A; --in-soft:rgba(113,203,154,.16);
  --save:#8AAEEA; --save-soft:rgba(138,174,234,.16);
  --warn:#E39A6B;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body.locked{overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding:0 18px calc(112px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 4px}
.top h1{flex:1;margin:0;font:700 21px/1 var(--f-display);font-variation-settings:"opsz" 24;letter-spacing:-.01em}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--in)}
.sync.local i{background:var(--warn)}
.icon-btn{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--muted)}
@media (hover:hover){.icon-btn:hover{background:var(--surface2)}}
.icon-btn svg{width:22px;height:22px}

.seg{display:flex;gap:2px;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,25,22,.14)}
.units{margin-top:10px}

.period{display:flex;align-items:center;gap:8px;margin:16px 0 0}
.period .lbl{flex:1;text-align:center;min-width:0}
.period .lbl b{display:block;font:700 19px/1.2 var(--f-display);font-variation-settings:"opsz" 24}
.period .lbl small{display:block;color:var(--muted);font-size:13.5px}
.arrow{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.arrow svg{width:18px;height:18px}
.back-now{display:block;margin:6px auto 0;border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:4px 10px}

.hero{padding:20px 0 4px}
.hero .cap{color:var(--muted);font-size:15px}
.hero .big{margin:2px 0 12px;font:800 clamp(46px,14vw,74px)/.95 var(--f-display);font-variation-settings:"opsz" 96,"wdth" 78;letter-spacing:-.02em;color:var(--out);font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-weight:700;font-size:15px;background:var(--surface2)}
.delta.up{background:var(--out-soft);color:var(--out)}
.delta.down{background:var(--in-soft);color:var(--in)}
.delta svg{width:14px;height:14px}
.sub{margin:8px 0 0;color:var(--muted);font-size:14.5px;max-width:42ch}

.flow{margin:22px 0 0}
.flow .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.flow .bar i{display:block;height:100%}
.flow .bar .e{background:var(--out)}
.flow .bar .s{background:var(--save)}
.flow .bar .r{background:var(--in)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-top:12px}
.legend div{display:flex;flex-direction:column;min-width:0}
.legend span{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c,var(--muted))}
.legend b{font:700 18px/1.25 var(--f-display);font-variation-settings:"opsz" 24;font-variant-numeric:tabular-nums}
.legend b.neg{color:var(--out)}
.flow-note{margin:10px 0 0;font-size:13.5px;color:var(--muted)}

.cmp{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.cmp > span{font-size:14px;color:var(--muted);font-weight:700}

.sec{margin-top:32px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{margin:0;font:700 19px/1.2 var(--f-display);font-variation-settings:"opsz" 24}
.sec-h small{color:var(--muted);font-size:13.5px;text-align:right}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14.5px;font-weight:700;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .x{font-size:16px;line-height:1;opacity:.7}

.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .base{stroke:var(--line)}
.chart .axis{fill:var(--muted);font:12px var(--f-body)}
.chart .bar{fill:var(--out);opacity:.5}
.chart .bar.on{opacity:1}
.chart .bar.sv{fill:var(--save)}
.chart .ghost{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;opacity:.5}
.chart .hit{fill:transparent;cursor:pointer}
.chart .l-cur{fill:none;stroke:var(--out);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .a-cur{fill:var(--out-soft)}
.chart .l-cmp{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-dasharray:5 4;opacity:.5}
.chart .l-sav{fill:none;stroke:var(--save);stroke-width:2.5;stroke-linejoin:round}
.chart .a-sav{fill:var(--save-soft)}
.chart .dot{fill:var(--out);stroke:var(--surface);stroke-width:2}
.chart .dot.sv{fill:var(--save)}
.chart .val{fill:var(--ink);font:700 12.5px var(--f-body)}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:13px;color:var(--muted)}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend .k-bar{width:10px;height:10px;border-radius:3px;background:var(--out)}
.chart-legend .k-ghost{width:14px;height:0;border-top:2.5px solid var(--ink);opacity:.5}
.chart-legend .k-dash{width:16px;height:0;border-top:2px dashed var(--ink);opacity:.55}

.list{list-style:none;margin:0;padding:0}
.cat{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.list li:last-child .cat{border-bottom:0}
.ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:19px}
.cat .m{flex:1;min-width:0}
.cat .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.cat .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .t b{font-variant-numeric:tabular-nums;white-space:nowrap}
.cat .b{height:6px;border-radius:3px;background:var(--surface2);margin:6px 0 3px;overflow:hidden}
.cat .b i{display:block;height:100%;border-radius:3px;background:var(--out)}
.cat .b.sv i{background:var(--save)}
.cat .d{font-size:13px;color:var(--muted)}
.cat .d.up{color:var(--out)}
.cat .d.down{color:var(--in)}

.hist{width:100%;border-collapse:collapse;font-size:14.5px}
.hist th{padding:0 0 6px;font-weight:400;font-size:13px;color:var(--muted);text-align:right}
.hist th:first-child,.hist td:first-child{text-align:left}
.hist td{padding:0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist td button{border:0;background:none;padding:10px 0;font-weight:inherit;text-align:left;width:100%}
.hist td:not(:first-child){padding:10px 0 10px 8px}
.hist tr.cur td{font-weight:700}
.hist .pos{color:var(--in)}
.hist .neg{color:var(--out)}

.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-top:14px}
.filters{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 2px}
.mhead h3{margin:0;font:700 18px var(--f-display);font-variation-settings:"opsz" 24}
.mhead small{font-size:13.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.dhead{margin:12px 0 2px;font-size:13.5px;color:var(--muted);font-weight:700}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:8px 6px;margin:0 -6px;border:0;border-radius:12px;background:none;text-align:left;width:calc(100% + 12px)}
@media (hover:hover){.tx:hover{background:var(--surface2)}}
.tx .m{flex:1;min-width:0;display:flex;flex-direction:column}
.tx .c{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .n{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.out{color:var(--out)}
.amt.in{color:var(--in)}
.amt.sv{color:var(--save)}
.muted{color:var(--muted)}
.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:700}

.empty{padding:22px 18px;text-align:left}
.empty h3{margin:0 0 6px;font:700 19px var(--f-display);font-variation-settings:"opsz" 24}
.empty p{margin:0 0 14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;font-weight:700}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.kpis div{display:flex;flex-direction:column}
.kpis span{font-size:13.5px;color:var(--muted)}
.kpis b{font:700 20px/1.25 var(--f-display);font-variation-settings:"opsz" 24;font-variant-numeric:tabular-nums}
.big2{margin:4px 0 6px;font:800 clamp(40px,12vw,62px)/.95 var(--f-display);font-variation-settings:"opsz" 96,"wdth" 78;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big2.sv{color:var(--save)}
.big2.in{color:var(--in)}
.big2.out{color:var(--out)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:1px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 4px 8px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11.5px;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px;height:24px}
.tabs .fab{justify-self:center;width:58px;height:58px;margin-top:-24px;border-radius:20px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(16,60,54,.3);display:grid;place-items:center}
.tabs .fab svg{width:28px;height:28px}

.scrim{position:fixed;inset:0;touch-action:none;z-index:30;background:rgba(8,16,14,.45);opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:31;max-width:560px;margin:0 auto;max-height:calc(100% - 20px - env(safe-area-inset-top,0px) - var(--kb,0px));overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:24px 24px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);--c:var(--out)}
.sheet.open{transform:none}
.sheet[data-type="income"]{--c:var(--in)}
.sheet[data-type="save"]{--c:var(--save)}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{transition:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{margin:0;font:700 21px var(--f-display);font-variation-settings:"opsz" 24}
.sheet .type-seg button[aria-pressed="true"]{color:var(--c)}
.amount{display:flex;align-items:baseline;gap:8px;margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.amount:focus-within{border-color:var(--c)}
.amount input{width:100%;min-width:0;border:0;background:transparent;outline:none;padding:0;font:800 46px/1.1 var(--f-display);font-variation-settings:"opsz" 96,"wdth" 80;color:var(--c);font-variant-numeric:tabular-nums}
.amount input::placeholder{color:var(--line)}
.amount span{font:700 26px var(--f-display);color:var(--muted)}
.flabel{display:block;margin:16px 0 7px;font-size:14px;font-weight:700;color:var(--muted)}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-height:46px}
.row{display:flex;gap:8px;align-items:center}
.row .inp{flex:1}
.hint{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:14px;color:var(--muted)}
.hint button{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.switch-row b{display:block}
.switch-row small{color:var(--muted);font-size:13.5px}
.switch{position:relative;flex:none;width:50px;height:30px}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:15px;background:var(--surface2);border:1px solid var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked + span{background:var(--accent);border-color:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{display:block;width:100%;margin-top:22px;padding:15px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.danger{display:block;width:100%;margin-top:8px;padding:12px;border:0;background:none;color:var(--out);font-weight:700}
.danger.armed{background:var(--out-soft);border-radius:14px}
.set-h{margin:22px 0 8px;font:700 17px var(--f-display);font-variation-settings:"opsz" 24}
.set-type{margin:14px 0 6px;font-size:14px;font-weight:700;color:var(--muted)}
.chip.del{padding-right:8px}
.chip.del button{border:0;background:none;padding:0 2px;font-size:18px;line-height:1;color:var(--muted)}
.emoji-inp{width:58px;flex:none!important;text-align:center}
.csv-out{width:100%;height:140px;margin-top:10px;font:16px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px}

.sync{white-space:nowrap}
.accs{display:flex;flex-direction:column;gap:12px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px 14px}
.acc-head{display:flex;align-items:center;gap:12px;width:100%;padding:0;border:0;background:none;text-align:left}
.acc-head .m{flex:1;min-width:0;display:flex;flex-direction:column}
.acc-head .c{font-weight:700}
.acc-head .n{font-size:13.5px;color:var(--muted)}
.acc-head .chev{font-size:24px;line-height:1;color:var(--muted)}
.acc-val{margin:10px 0 2px;font:800 32px/1.1 var(--f-display);color:var(--save);font-variant-numeric:tabular-nums}
.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:8px 0 0}
.acc-grid span{display:block;font-size:13px;color:var(--muted)}
.acc-grid b{font-variant-numeric:tabular-nums}
.acc-move{margin:8px 0 0;font-size:14.5px;font-weight:700}
.acc .btn{padding:9px 13px;font-size:15px}
.gain{color:var(--in)}
.loss{color:var(--out)}
.sym-hit{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;margin-top:6px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left}
.sym-hit span{font-size:14px}
.sym-hit small{font-size:12.5px;color:var(--muted)}
.btn:disabled{opacity:.6}
.snap-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.snap-row span:nth-child(2){flex:1;text-align:right}
.snap-row button{border:0;background:none;color:var(--muted);font-size:20px;padding:0 4px;min-width:30px}
@media (max-width:360px){
  .app{padding-left:14px;padding-right:14px}
  .top h1{font-size:19px}
  .tabs button{font-size:10.5px;letter-spacing:-.01em}
  .tabs .fab{width:52px;height:52px}
  .hist{font-size:13px}
}
.notice{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--save)}
.notice.bad{border-left-color:var(--out)}
.notice p{margin:2px 0 10px;color:var(--muted);font-size:14.5px}
.notice.bad p{margin-bottom:0}
details summary{font-size:14.5px}
.toast:not(.show) .undo{pointer-events:none;visibility:hidden}
.toast .undo{margin-left:12px;border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:0;pointer-events:auto}

<script>
'use strict';
const APP_VERSION = '1.2.1';
/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const EUR0 = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0});
const fmt = c => EUR.format((c||0)/100);
const fmt0 = c => EUR0.format(Math.round((c||0)/100));
const MINUS = '\u2212';
const signed = (c, plus=true) => (c < 0 ? MINUS : (plus ? '+' : '')) + fmt(Math.abs(c));

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y||2000,(m||1)-1,d||1,12); };
const todayIso = () => iso(new Date());
const todayDate = () => parse(todayIso());
const addDays = (d,n) => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate(),12); x.setDate(x.getDate()+n); return x; };
const addMonths = (d,n) => { const day=d.getDate(); const x=new Date(d.getFullYear(),d.getMonth()+n,1,12); const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(day,last)); return x; };
const daysBetween = (a,b) => Math.round((parse(iso(b)) - parse(iso(a))) / 86400000);
const startOfWeek = d => addDays(d, -((d.getDay()+6)%7));
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const wd=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-wd); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return {w:Math.ceil(((t-y0)/86400000+1)/7), y:t.getUTCFullYear()}; }
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MSHORT = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
const WD = ['So.','Mo.','Di.','Mi.','Do.','Fr.','Sa.'];
const WDL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const dmy = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
const dm = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2,10));
function normNum(s){
  s = String(s||'').trim().replace(/[\s€\u00a0]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  return s;
}
function parseMoney(s, allowZero){
  s = normNum(s);
  if(!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
  const v = Math.round(parseFloat(s)*100);
  return (allowZero ? v>=0 : v>0) && v<=1e11 ? v : NaN;
}
const parseAmount = s => parseMoney(s, false);
function parseDecimal(s){ s = normNum(s); if(!/^\d+(\.\d{1,6})?$/.test(s)) return NaN; const v=parseFloat(s); return v>0 && v<1e9 ? v : NaN; }
const fmtPct = (x, d=1) => (x>=0?'+':'\u2212') + Math.abs(x*100).toFixed(d).replace('.',',') + ' %';
const fmtNum = (x, d) => Number(x).toLocaleString('de-DE', {maximumFractionDigits:d});
const amountStr = c => (Math.abs(c)/100).toFixed(2).replace('.',',');
const amountIn = c => (c<0?'-':'') + (Math.abs(c)/100).toLocaleString('de-DE',{minimumFractionDigits:2, maximumFractionDigits:2});

const ICON = {
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- Daten ---------- */
const DEFAULT_CATS = {
  expense:[['lebensmittel','Lebensmittel','🛒'],['wohnen','Miete & Wohnen','🏠'],['energie','Energie & Nebenkosten','💡'],['mobil','Mobilität','🚗'],['versich','Versicherungen','🛡️'],['kinder','Kinder','🧸'],['gesund','Gesundheit','💊'],['freizeit','Freizeit','🎈'],['essen','Restaurant & Café','☕'],['kleidung','Kleidung','👕'],['abos','Abos & Medien','📺'],['haushalt','Haushalt','🧽'],['geschenke','Geschenke','🎁'],['sonst-a','Sonstiges','📦']],
  income:[['gehalt','Gehalt & Bezüge','💼'],['kindergeld','Kindergeld','👶'],['erstattung','Erstattungen','↩️'],['sonst-e','Sonstiges','➕']],
  save:[['tagesgeld','Tagesgeld','🏦'],['etf','ETF-Depot','📈'],['sonst-s','Sonstiges','🐷']]
};
const FALLBACK = {expense:'sonst-a', income:'sonst-e', save:'sonst-s'};
const TYPE_NAME = {expense:'Ausgabe', income:'Einnahme', save:'Sparen'};
const FREQ = {weekly:'wöchentlich', monthly:'monatlich', quarterly:'vierteljährlich', halfyearly:'halbjährlich', yearly:'jährlich'};
const FREQ_FACTOR = {weekly:52/12, monthly:1, quarterly:1/3, halfyearly:1/6, yearly:1/12};

function defaultSettings(){ const c={}; for(const k in DEFAULT_CATS) c[k]=DEFAULT_CATS[k].map(([id,name,icon])=>k==='save' ? {id,name,icon,kind:id==='etf'?'etf':'cash',snaps:[]} : {id,name,icon}); return {v:2, categories:c, recurring:[]}; }
const TYPES = ['expense','income','save'];
const isDate = v => typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && iso(parse(v))===v;
const str = (v,n) => String(v==null ? '' : v).slice(0,n);
const firstChars = (v,n) => {
  const s = String(v||'');
  try{ if(window.Intl && Intl.Segmenter){ return Array.from(new Intl.Segmenter('de',{granularity:'grapheme'}).segment(s), x=>x.segment).slice(0,1).join('').slice(0,16); } }catch(e){}
  return Array.from(s).slice(0,n).join('');
};
function cleanAmount(type, v){ const a=Math.round(Number(v)); if(!Number.isFinite(a) || a===0 || Math.abs(a)>1e11) return null; return type==='save' ? a : Math.abs(a); }
function cleanTx(t){
  if(!t || typeof t!=='object' || !TYPES.includes(t.type) || !isDate(t.date)) return null;
  const amount = cleanAmount(t.type, t.amount); if(amount==null) return null;
  const o = {id:str(t.id,120) || newId(), type:t.type, amount, cat:str(t.cat,60) || FALLBACK[t.type], date:t.date, note:str(t.note,120), created:Number(t.created)||0};
  if(t.recurringId) o.recurringId = str(t.recurringId,80);
  return o;
}
function cleanTxList(list){ const seen=new Set(), out=[]; for(const t of (Array.isArray(list)?list:[])){ const c=cleanTx(t); if(c && !seen.has(c.id)){ seen.add(c.id); out.push(c); } } return out; }
function cleanRule(r){
  if(!r || typeof r!=='object' || !TYPES.includes(r.type) || !isDate(r.start) || !FREQ[r.freq]) return null;
  const amount = cleanAmount(r.type, r.amount); if(amount==null) return null;
  return {id:str(r.id,80) || newId(), type:r.type, amount, cat:str(r.cat,60) || FALLBACK[r.type], note:str(r.note,120), freq:r.freq, start:r.start, end:isDate(r.end) ? r.end : null, active:r.active!==false, until:isDate(r.until) ? r.until : null};
}
// Hält den Speicherbedarf klein: automatische Kursstände älter als 2 Jahre nur noch einer pro Monat; eigene Einträge bleiben immer.
function thinSnaps(list){
  if(list.length <= 1500) return list;
  const lim = iso(addDays(todayDate(), -730)), lastOfMonth = new Map();
  for(const x of list) if(x.auto && x.date < lim) lastOfMonth.set(x.date.slice(0,7), x.date);
  return list.filter(x => !x.auto || x.date >= lim || lastOfMonth.get(x.date.slice(0,7))===x.date);
}
const cleanSymbol = v => String(v||'').toUpperCase().replace(/[^A-Z0-9.\-]/g,'').slice(0,20);
function cleanAcc(c, id){
  const o = {kind: (c.kind==='etf' || c.kind==='cash') ? c.kind : (id==='etf' ? 'etf' : 'cash')};
  if(c.isin){ const i=String(c.isin).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12); if(i) o.isin=i; }
  if(c.symbol){ const y=cleanSymbol(c.symbol); if(y) o.symbol=y; }
  if(c.cur && /^[A-Z]{3}$/.test(String(c.cur))) o.cur=String(c.cur);
  if(c.base && isDate(c.base.date)){ const inv=Math.round(Number(c.base.invested)); if(Number.isFinite(inv) && Math.abs(inv)<=1e11) o.base={date:c.base.date, at:Number(c.base.at)||0, invested:inv}; }
  const m = new Map();
  for(const x of (Array.isArray(c.snaps) ? c.snaps : [])){
    if(!x || !isDate(x.date)) continue;
    const v=Math.round(Number(x.value)); if(!Number.isFinite(v) || Math.abs(v)>1e11) continue;
    const sn={date:x.date, at:Number(x.at)||0, value:v};
    const sh=Number(x.shares), pr=Number(x.price), ch=Number(x.chg);
    if(sh>0 && sh<1e9) sn.shares=sh;
    if(pr>0 && pr<1e7) sn.price=pr;
    if(x.auto) sn.auto=true;
    if(isDate(x.pdate)) sn.pdate=x.pdate;
    if(x.chg!=null && Number.isFinite(ch) && Math.abs(ch)<1) sn.chg=ch;
    m.set(x.date, sn);
  }
  o.snaps = thinSnaps([...m.values()].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0));
  return o;
}
function normalizeSettings(d){
  const def = defaultSettings(), out = {v:2, categories:{}, recurring:[]};
  const src = (d && typeof d==='object') ? d : {};
  for(const k of TYPES){
    const list = src.categories && Array.isArray(src.categories[k]) ? src.categories[k] : def.categories[k];
    const cats = list.filter(c=>c && c.id).map(c=>{ const o={id:str(c.id,60), name:str(c.name,30) || 'Ohne Namen', icon:firstChars(c.icon,2) || '🏷️'}; if(c.hidden) o.hidden=true; if(k==='save') Object.assign(o, cleanAcc(c, o.id)); return o; });
    if(!cats.some(c=>c.id===FALLBACK[k])) cats.push(JSON.parse(JSON.stringify(def.categories[k].find(c=>c.id===FALLBACK[k]))));
    if(k==='save' && !(Number(src.v)>=2) && !cats.some(c=>c.id==='tagesgeld')) cats.unshift({id:'tagesgeld', name:'Tagesgeld', icon:'🏦', kind:'cash', snaps:[]});
    out.categories[k] = cats;
  }
  if(Array.isArray(src.recurring)) for(const r of src.recurring){ const c=cleanRule(r); if(c) out.recurring.push(c); }
  return out;
}
function catOf(type,id){ const list=S.settings.categories[type]||[]; return list.find(c=>c.id===id) || list.find(c=>c.id===FALLBACK[type]) || {id, name:'Sonstiges', icon:'📦'}; }
const visibleCats = type => (S.settings.categories[type]||[]).filter(c=>!c.hidden);

const S = {
  tx: [], settings: defaultSettings(), meta: {lastBackup:0},
  ui: { view:'home', unit:'month', anchor: todayDate(), cmp:'prev', f:{type:'all', cat:null, catType:null, range:null, q:''}, limit:150 }
};
const sortTx = () => S.tx.sort((a,b)=> a.date<b.date ? 1 : a.date>b.date ? -1 : (b.created||0)-(a.created||0));

/* ---------- Speicher ----------
   Alle Daten bleiben auf diesem Gerät. Die App sendet nichts über das Netz.
   Jede Änderung wird doppelt abgelegt: im localStorage und als Spiegel in IndexedDB.
   Vor riskanten Aktionen (alles löschen, Sicherung einlesen) wird ein Notfall-Stand angelegt. */
const KEY = 'hb-local';
const LS = {
  get(k){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  test(){ try{ localStorage.setItem('hb-test','1'); localStorage.removeItem('hb-test'); return true; }catch(e){ return false; } }
};
const IDB = {
  db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('haushaltsbuch',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{ this.db=r.result; res(true); }; r.onerror=()=>res(false); r.onblocked=()=>res(false); }catch(e){ res(false); } }); },
  get(k){ return new Promise(res=>{ if(!this.db) return res(null); try{ const q=this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }catch(e){ res(null); } }); },
  set(k,v){ return new Promise(res=>{ if(!this.db) return res(false); try{ const t=this.db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(true); t.onerror=t.onabort=()=>res(false); }catch(e){ res(false); } }); },
  del(k){ return new Promise(res=>{ if(!this.db) return res(false); try{ const t=this.db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=()=>res(true); t.onerror=t.onabort=()=>res(false); }catch(e){ res(false); } }); }
};
const Store = {
  ok:true, idbOk:false, persisted:false, rescue:null, ready:false,
  payload(){ return {v:1, savedAt:Date.now(), tx:S.tx, settings:S.settings, meta:S.meta}; },
  apply(d){
    S.tx = cleanTxList(d && d.tx);
    S.settings = normalizeSettings(d && d.settings);
    const m = d && d.meta && typeof d.meta==='object' ? d.meta : {};
    S.meta = {lastBackup:Number(m.lastBackup)||0, changes:Number(m.changes)||0};
    sortTx();
  },
  async init(){
    this.ok = LS.test();
    try{ localStorage.removeItem('hb-cache'); }catch(e){}
    const ls = LS.get(KEY);
    this.idbOk = await Promise.race([IDB.open(), new Promise(r=>setTimeout(()=>r(false), 2000))]);
    let src = ls;
    if(this.idbOk){
      const mirror = await IDB.get('data');
      const lsTime = ls && ls.savedAt || 0, idbTime = mirror && mirror.savedAt || 0;
      if(mirror && (!ls || idbTime > lsTime)){
        src = mirror; LS.set(KEY, mirror);
        if(!ls && mirror.tx && mirror.tx.length) setTimeout(()=>toast('Daten aus dem Zweitspeicher wiederhergestellt'), 300);
      } else if(ls){ IDB.set('data', ls); }
      this.rescue = await IDB.get('rescue');
    }
    this.apply(src);
    this.ready = true;
    render();
    try{
      const pv = localStorage.getItem('hb-ver');
      if(pv !== APP_VERSION){ if(pv || S.tx.length) setTimeout(()=>toast(`Update installiert: Version ${APP_VERSION}`), 600); localStorage.setItem('hb-ver', APP_VERSION); }
    }catch(e){}
    runRecurring();
    try{ if(navigator.storage && navigator.storage.persist){ this.persisted = await navigator.storage.persisted() || await navigator.storage.persist(); } }catch(e){}
  },
  save(){
    if(!this.ready) return false;
    S.meta.changes = (S.meta.changes||0) + 1;
    const p = this.payload();
    const lsOk = LS.set(KEY, p);
    const idbP = this.idbOk ? IDB.set('data', p) : Promise.resolve(false);
    if(lsOk){ if(!this.ok){ this.ok = true; render(); } return true; }
    idbP.then(idbOk=>{
      this.ok = idbOk;
      if(!idbOk) toast('Speichern auf dem Gerät fehlgeschlagen. Bitte sofort eine Sicherung erstellen.');
      render();
    });
    return true;
  },
  async snapshot(reason){
    const snap = {...this.payload(), reason, at:Date.now()};
    if(this.idbOk && await IDB.set('rescue', snap)){ this.rescue = snap; return true; }
    return false;
  },
  putTx(){ return this.save(); },
  delTx(){ return this.save(); },
  saveSettings(){ return this.save(); }
};
window.addEventListener('storage', e => { if(Store.ready && e.key===KEY){ const d=LS.get(KEY); if(d){ Store.apply(d); render(); } } });
// Tastatur auf dem iPhone: Eingabefenster oberhalb der Tastatur halten
if(window.visualViewport){
  const vv = window.visualViewport;
  const kb = () => { const h = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)); document.documentElement.style.setProperty('--kb', (h > 80 ? h : 0) + 'px'); };
  vv.addEventListener('resize', kb); vv.addEventListener('scroll', kb);
}
const IS_IOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.userAgent.includes('Mac') && 'ontouchend' in document);
const STANDALONE = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

/* ---------- Wiederkehrende Buchungen ---------- */
function nth(rule,n){
  const s = parse(rule.start);
  switch(rule.freq){
    case 'weekly': return addDays(s, 7*n);
    case 'quarterly': return addMonths(s, 3*n);
    case 'halfyearly': return addMonths(s, 6*n);
    case 'yearly': return addMonths(s, 12*n);
    default: return addMonths(s, n);
  }
}
function occurrences(rule, afterIso, uptoIso){
  const out=[];
  for(let n=0; n<2000; n++){
    const d = iso(nth(rule,n));
    if(d > uptoIso) break;
    if(rule.end && d > rule.end) break;

const accounts = () => S.settings.categories.save;

/* ---------- Kursabruf (optional, nur auf Tippen) ----------

const QKEY = 'hb-quote';

function userErr(msg){ const e = new Error(msg); e.userMsg = msg; return e; }
async function avRequest(params){
  const q = quoteCfg();

  catch(e){ throw userErr(e && e.name==='AbortError' ? 'Der Kursdienst antwortet nicht. Bitte später erneut versuchen.' : 'Der Kursdienst ist gerade nicht erreichbar. Bitte Internetverbindung prüfen.'); }

  let d; try{ d = await res.json(); }catch(e){ throw userErr('Unerwartete Antwort vom Kursdienst.'); }
  if(!d || typeof d!=='object') throw userErr('Unerwartete Antwort vom Kursdienst.');
  const info = d['Information'] || d['Note'] || d['Error Message'];
  if(info && Object.keys(d).length <= 2){
    const t = String(info).toLowerCase();
    if(t.includes('rate limit') || t.includes('per day') || t.includes('per minute') || t.includes('frequency')) throw userErr('Abruf-Limit des kostenlosen Schlüssels erreicht (25 Abrufe pro Tag). Bitte später erneut versuchen.');
    if(t.includes('premium')) throw userErr('Diese Abfrage ist beim Kursdienst kostenpflichtig.');
    if(t.includes('apikey') || t.includes('api key')) throw userErr('Der API-Schlüssel wurde nicht akzeptiert. Bitte in den Einstellungen prüfen.');
    if(t.includes('invalid api call')) throw userErr('Zu diesem Kürzel kennt der Kursdienst keinen Kurs. Bitte das Kürzel prüfen.');

function parseQuote(d){
  const g = d['Global Quote'] || d['Global quote'];
  if(!g || typeof g!=='object' || !Object.keys(g).length) throw userErr('Zu diesem Kürzel wurde kein Kurs gefunden. Tipp: XETRA-Kürzel enden auf .DEX – über „Suchen“ im Konto findest du das richtige.');
  const pick = re => { const k = Object.keys(g).find(x=>re.test(x)); return k ? String(g[k]).trim() : ''; };
  const price = parseFloat(pick(/^\s*0?5\.\s*price/i));
  if(!(price>0) || price>=1e7) throw userErr('Der Kursdienst hat keinen gültigen Kurs geliefert.');
  const day = pick(/latest trading day/i);
  const chg = parseFloat(pick(/change percent/i).replace('%',''));
  return {price, pdate: isDate(day) ? day : todayIso(), chg: Number.isFinite(chg) && Math.abs(chg)<100 ? chg/100 : null};
}
function sharesBase(a, d){ const s=(a.snaps||[]).filter(x=>x.shares>0 && x.date<=d); return s.length ? s[s.length-1] : null; }
function applyQuote(a, q){
  const t = todayIso(), list = accList(a), base = sharesBase(a, t);

  let date = q.pdate > t ? t : q.pdate;

  const value = Math.round(shares*q.price*100);

let quoteBusy = false, quoteConfirm = null;

async function fetchQuote(a, btn){

/* ---------- Zeiträume ---------- */
function rangeFor(unit, anchor){
  const a = parse(iso(anchor));
  if(unit==='day') return {unit, start:a, end:a};
  if(unit==='week'){ const s=startOfWeek(a); return {unit, start:s, end:addDays(s,6)}; }
  if(unit==='month') return {unit, start:new Date(a.getFullYear(),a.getMonth(),1,12), end:new Date(a.getFullYear(),a.getMonth()+1,0,12)};
  return {unit, start:new Date(a.getFullYear(),0,1,12), end:new Date(a.getFullYear(),11,31,12)};
}
function shift(unit, d, n){ if(unit==='day') return addDays(d,n); if(unit==='week') return addDays(d,7*n); if(unit==='month') return addMonths(d,n); return addMonths(d,12*n); }

function cmpModes(unit){ return unit==='year' ? ['prev','avg3'] : ['prev','yoy','avg3']; }
function compareRanges(r, mode){
  if(mode==='avg3') return [1,2,3].map(k=>rangeFor(r.unit, shift(r.unit, r.start, -k)));
  if(mode==='yoy'){
    if(r.unit==='week') return [rangeFor('week', addDays(r.start,-364))];
    return [rangeFor(r.unit, addMonths(r.start,-12))];
  }
  return [rangeFor(r.unit, shift(r.unit, r.start, -1))];
}
function rangeTitle(r){
  const s=r.start, e=r.end;
  if(r.unit==='day') return {t:`${WDL[s.getDay()]}, ${s.getDate()}. ${MONTHS[s.getMonth()]}`, s:String(s.getFullYear())};
  if(r.unit==='week'){
    const w=isoWeek(s).w;
    const sub = s.getMonth()===e.getMonth() ? `${s.getDate()}.–${e.getDate()}. ${MONTHS[e.getMonth()]} ${e.getFullYear()}` : `${s.getDate()}. ${MSHORT[s.getMonth()]} – ${e.getDate()}. ${MSHORT[e.getMonth()]} ${e.getFullYear()}`;
    return {t:`Kalenderwoche ${w}`, s:sub};
  }
  if(r.unit==='month') return {t:`${MONTHS[s.getMonth()]} ${s.getFullYear()}`, s:''};
  return {t:String(s.getFullYear()), s:''};
}

/* ---------- Auswertung ---------- */
function totals(start, end){
  const s=iso(start), e=iso(end); let inc=0, exp=0, sav=0; const byCat={}, bySave={};
  for(const t of S.tx){
    if(t.date<s || t.date>e) continue;
    if(t.type==='expense'){ exp+=t.amount; byCat[t.cat]=(byCat[t.cat]||0)+t.amount; }
    else if(t.type==='income') inc+=t.amount;
    else { sav+=t.amount; bySave[t.cat]=(bySave[t.cat]||0)+t.amount; }
  }
  return {inc, exp, sav, byCat, bySave};
}
function avgTotals(list){

  for(const t of list){ o.inc+=t.inc/n; o.exp+=t.exp/n; o.sav+=t.sav/n; for(const k in t.byCat) o.byCat[k]=(o.byCat[k]||0)+t.byCat[k]/n; }
  o.inc=Math.round(o.inc); o.exp=Math.round(o.exp); o.sav=Math.round(o.sav); for(const k in o.byCat) o.byCat[k]=Math.round(o.byCat[k]);
  return o;
}
function expByDate(){ const m={}; for(const t of S.tx) if(t.type==='expense') m[t.date]=(m[t.date]||0)+t.amount; return m; }
function niceMax(c){

  for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*p >= e) return Math.round(m*p*100);
  return Math.round(10*p*100);
}

/* ---------- Diagramme ---------- */
function svgBars(items, opts={}){
  const W=340, H=158, top=18, bot=22, left=2, right=2, n=items.length;
  const max = niceMax(Math.max(1, ...items.map(i=>Math.max(i.value, i.ghost||0))));
  const slot=(W-left-right)/n, bw=Math.min(24, slot*.6);
  const y = v => top + (H-top-bot) * (1 - Math.max(0,v)/max);
  let g = `<line class="grid" x1="0" x2="${W}" y1="${y(max)}" y2="${y(max)}"/><text class="axis" x="0" y="${y(max)-5}">${fmt0(max)}</text><line class="base" x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}"/>`;
  items.forEach((it,i)=>{
    const cx = left + slot*(i+.5), h = (H-bot) - y(it.value);
    if(it.value>0) g += `<rect class="bar${opts.cls?' '+opts.cls:''}${it.active?' on':''}" x="${(cx-bw/2).toFixed(1)}" y="${y(it.value).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.5,h).toFixed(1)}" rx="${Math.min(4,h/2).toFixed(1)}"/>`;
    if(it.ghost!=null && it.ghost>0) g += `<line class="ghost" x1="${(cx-bw/2-3).toFixed(1)}" x2="${(cx+bw/2+3).toFixed(1)}" y1="${y(it.ghost).toFixed(1)}" y2="${y(it.ghost).toFixed(1)}"/>`;
    if(it.label) g += `<text class="axis" x="${cx.toFixed(1)}" y="${H-5}" text-anchor="middle"${it.active?' style="font-weight:700;fill:var(--ink)"':''}>${esc(it.label)}</text>`;
    const tip = `${it.title||it.label}: ${fmt(it.value)}${it.ghost!=null?`, Vergleich ${fmt(it.ghost)}`:''}`;
    g += `<rect class="hit" x="${(left+slot*i).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${H}"${it.drill?` data-action="drill" data-unit="${it.drill.unit}" data-date="${it.drill.date}"`:''}><title>${esc(tip)}</title></rect>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'Balkendiagramm')}">${g}</svg>`;
}
function svgLines(n, series, opts={}){
  const W=340, H=168, top=20, bot=22, left=2, right=10;
  const all = series.flatMap(s=>s.vals.filter(v=>v!=null));
  let lo = Math.min(0, ...all), max = niceMax(Math.max(1, ...all));
  if(opts.fit && all.length){ const mn=Math.min(...all), mx=Math.max(...all), span=Math.max(mx-mn, Math.abs(mx)*0.02, 100); lo=Math.max(0, mn-span*0.35); max=mx+span*0.2; }
  const x = i => left + (W-left-right) * (n<=1 ? 0 : i/(n-1));
  const y = v => top + (H-top-bot) * (1 - (v-lo)/(max-lo));
  let g = opts.fit ? '' : `<line class="grid" x1="0" x2="${W}" y1="${y(max)}" y2="${y(max)}"/><text class="axis" x="0" y="${y(max)-5}">${fmt0(max)}</text><line class="base" x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>`;
  const floor = opts.fit ? H-bot : y(0);
  if(opts.fit) g += `<line class="base" x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}"/>`;
  for(const s of series){
    const pts = s.vals.map((v,i)=> v==null ? null : [x(i), y(v)]).filter(Boolean);
    if(!pts.length) continue;
    const d = pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
    if(s.area) g += `<path class="${s.area}" d="${d}L${pts[pts.length-1][0].toFixed(1)} ${floor.toFixed(1)}L${pts[0][0].toFixed(1)} ${floor.toFixed(1)}Z"/>`;
    g += `<path class="${s.cls}" d="${d}"/>`;
    if(s.dot){ const p=pts[pts.length-1], v=s.vals.filter(v=>v!=null).pop(); const anchor = p[0] > W*.7 ? 'end' : 'start'; g += `<circle class="dot${s.dotCls?' '+s.dotCls:''}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5"/><text class="val" x="${(p[0] + (anchor==='end'?-9:9)).toFixed(1)}" y="${(p[1]-9).toFixed(1)}" text-anchor="${anchor}">${fmt0(v)}</text>`; }
  }
  for(const l of (opts.xLabels||[])) g += `<text class="axis" x="${x(l.i).toFixed(1)}" y="${H-5}" text-anchor="${l.i===0?'start':l.i===n-1?'end':'middle'}">${esc(l.t)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'Liniendiagramm')}">${g}</svg>`;
}
function homeChart(r, mode){
  const E = expByDate(), cmps = compareRanges(r, mode), t = todayIso();
  const avgAt = fnDate => Math.round(cmps.reduce((s,c)=>s+(E[iso(fnDate(c))]||0),0)/cmps.length);
  if(r.unit==='day'){
    const items=[]; for(let i=13;i>=0;i--){ const d=addDays(r.start,-i); items.push({label: i%2===0 ? String(d.getDate()) : '', title:`${WD[d.getDay()]} ${dm(d)}`, value:E[iso(d)]||0, active:i===0, drill:{unit:'day',date:iso(d)}}); }
    return {title:'Die letzten 14 Tage', svg:svgBars(items,{aria:'Ausgaben der letzten 14 Tage'}), legend:`<span><i class="k-bar"></i>Ausgaben pro Tag</span>`};
  }
  if(r.unit==='week'){
    const items=[]; for(let i=0;i<7;i++){ const d=addDays(r.start,i); items.push({label:WD[d.getDay()].replace('.',''), title:`${WD[d.getDay()]} ${dm(d)}`, value:E[iso(d)]||0, ghost:avgAt(c=>addDays(c.start,i)), active:iso(d)===t, drill:{unit:'day',date:iso(d)}}); }
    return {title:'Ausgaben pro Tag', svg:svgBars(items,{aria:'Ausgaben pro Wochentag'}), legend:`<span><i class="k-bar"></i>Diese Woche</span><span><i class="k-ghost"></i>${esc(cmpChipLabel(r.unit,mode,r))}</span>`};
  }
  if(r.unit==='year'){
    const M = {}; for(const x of S.tx) if(x.type==='expense'){ const k=x.date.slice(0,7); M[k]=(M[k]||0)+x.amount; }
    const key = (y,m) => `${y}-${pad(m+1)}`;
    const items=[]; for(let m=0;m<12;m++){ const g=Math.round(cmps.reduce((s,c)=>s+(M[key(c.start.getFullYear(),m)]||0),0)/cmps.length); items.push({label:MONTHS[m][0], title:MONTHS[m], value:M[key(r.start.getFullYear(),m)]||0, ghost:g, active:r.start.getFullYear()===todayDate().getFullYear() && m===todayDate().getMonth(), drill:{unit:'month',date:iso(new Date(r.start.getFullYear(),m,1,12))}}); }
    return {title:'Ausgaben pro Monat', svg:svgBars(items,{aria:'Ausgaben pro Monat'}), legend:`<span><i class="k-bar"></i>${r.start.getFullYear()}</span><span><i class="k-ghost"></i>${esc(cmpChipLabel(r.unit,mode,r))}</span>`};
  }
  // Monat: kumulierter Verlauf
  const n = r.end.getDate(), cur=[], ref=[]; let acc=0;
  for(let i=0;i<n;i++){ const d=addDays(r.start,i); if(iso(d) > t){ cur.push(null); continue; } acc += E[iso(d)]||0; cur.push(acc); }
  const len = Math.max(...cmps.map(c=>c.end.getDate()));
  const cums = cmps.map(c=>{ let a=0; const arr=[]; for(let i=0;i<c.end.getDate();i++){ a+=E[iso(addDays(c.start,i))]||0; arr.push(a); } return arr; });
  for(let i=0;i<Math.max(n,len);i++) ref.push(Math.round(cums.reduce((s,arr)=>s+arr[Math.min(i,arr.length-1)],0)/cums.length));
  const N = Math.max(n, ref.length);
  while(cur.length<N) cur.push(null);
  const xl=[{i:0,t:'1.'},{i:9,t:'10.'},{i:19,t:'20.'},{i:n-1,t:`${n}.`}];
  return {title:'Ausgaben im Monatsverlauf', svg:svgLines(N, [{vals:ref, cls:'l-cmp'},{vals:cur, cls:'l-cur', area:'a-cur', dot:true}], {xLabels:xl, aria:'Kumulierte Ausgaben im Monat'}), legend:`<span><i class="k-bar"></i>Aufsummiert bis Tag</span><span><i class="k-dash"></i>${esc(cmpChipLabel(r.unit,mode,r))}</span>`};
}

function seg(action, options, current, cls=''){
  return `<div class="seg ${cls}" role="group">${options.map(([v,l])=>`<button data-action="${action}" data-v="${v}" aria-pressed="${v===current}">${l}</button>`).join('')}</div>`;
}
function deltaBadge(cur, ref, invert=false){
  if(ref===0 && cur===0) return '';
  const d = cur-ref;
  if(ref===0) return '';
  const pct = Math.round(Math.abs(d)/ref*100);
  if(pct===0) return `<span class="delta">gleich viel</span>`;
  const worse = invert ? d<0 : d>0;
  return `<span class="delta ${worse?'up':'down'}">${d>0?ICON.up:ICON.down}${pct} % ${d>0?'mehr':'weniger'}</span>`;
}

  else if(IS_IOS && !STANDALONE) h += `<div class="notice bad"><b>Zum Home-Bildschirm hinzufügen</b><p>In einem Safari-Tab kann das iPhone die Daten nach einigen Tagen ohne Nutzung löschen. Tippe auf das Teilen-Symbol und dann auf „Zum Home-Bildschirm“. Öffne die App danach nur noch über das neue Symbol. Daten aus diesem Tab vorher sichern und dort einlesen.</p><button class="btn" data-action="settings">Daten sichern</button></div>`;

  h += `<section class="hero"><div class="cap">Ausgegeben</div><div class="big">${fmt(cur.exp)}</div>`;
  if(!S.tx.length){
    h += `</section><div class="panel empty"><h3>Los geht’s</h3><p>Tippe unten auf das Plus und erfasse deine erste Ausgabe. Mehr als den Betrag brauchst du nicht – Kategorie und Datum sind schon vorbelegt.</p><div class="btn-row"><button class="btn solid" data-action="add">Ausgabe erfassen</button><button class="btn" data-action="add" data-type="income">Einnahme erfassen</button><button class="btn" data-action="rule-new">Fixkosten anlegen</button></div></div>`;
    return h;
  }
  if(now && u!=='day'){
    const off = daysBetween(r.start, today);
    const curTD = totals(r.start, today).exp;
    const refTD = Math.round(cmps.reduce((s,c)=>{ const e=addDays(c.start,off); return s+totals(c.start, e>c.end?c.end:e).exp; },0)/cmps.length);
    h += deltaBadge(curTD, refTD);
    const Ph = esc(ph.charAt(0).toUpperCase()+ph.slice(1));
    h += `<p class="sub">${ref.exp===0 ? `${Ph} sind keine Ausgaben erfasst.` : `Zum gleichen Zeitpunkt ${esc(ph)} waren es ${fmt(refTD)}. ${Ph} insgesamt: ${fmt(ref.exp)}.`}</p>`;
  } else {
    h += deltaBadge(cur.exp, ref.exp);
    h += `<p class="sub">${!cur.exp && !ref.exp ? 'In diesem Zeitraum gibt es keine Ausgaben.' : ref.exp===0 ? `${esc(ph.charAt(0).toUpperCase()+ph.slice(1))} sind keine Ausgaben erfasst.` : `Zum Vergleich: ${fmt(ref.exp)} ${esc(ph)}.`}</p>`;
  }
  h += `</section>`;

    <div class="legend">
      <div style="--c:var(--in)"><span>Einnahmen</span><b>${fmt(cur.inc)}</b></div>

      ${cur.inc>0 ? `<div style="--c:${rest>=0?'var(--in)':'var(--out)'}"><span>${rest>=0?'Übrig':'Fehlbetrag'}</span><b class="${rest<0?'neg':''}">${fmt(Math.abs(rest))}</b></div>` : ''}
    </div>${cur.inc===0 && (cur.exp||cur.sav) ? `<p class="flow-note">In diesem Zeitraum sind keine Einnahmen erfasst.</p>` : ''}</div>`;

  // Vergleich
  h += `<div class="cmp"><span>Vergleichen mit</span><div class="chips">${modes.map(m=>`<button class="chip" data-action="cmp" data-v="${m}" aria-pressed="${m===mode}">${esc(cmpChipLabel(u,m,r))}</button>`).join('')}</div></div>`;

  // Diagramm
  const ch = homeChart(r, mode);
  h += `<section class="sec"><div class="sec-h"><h2>${esc(ch.title)}</h2>${u!=='month'?'<small>Tippen für Details</small>':''}</div><div class="panel">${ch.svg}<div class="chart-legend">${ch.legend}</div></div></section>`;

  // Kategorien
  const ids = new Set([...Object.keys(cur.byCat), ...Object.keys(ref.byCat)]);
  const rows = [...ids].map(id=>({id, v:cur.byCat[id]||0, c:ref.byCat[id]||0})).sort((a,b)=>b.v-a.v || b.c-a.c);
  const top = Math.max(1, ...rows.map(x=>x.v));
  h += `<section class="sec"><div class="sec-h"><h2>Wofür</h2><small>Differenz ${esc(ph)}</small></div>`;
  if(rows.length){
    h += `<ul class="list">` + rows.map(x=>{

    }).join('') + `</ul>`;
  } else h += `<p class="muted">Keine Ausgaben in diesem Zeitraum.</p>`;

  }
  h += `</tbody></table></div></section>`;
  return h;

function filteredTx(){
  const f=S.ui.f, q=f.q.trim().toLowerCase();
  return S.tx.filter(t=>{
    if(f.type!=='all' && t.type!==f.type) return false;
    if(f.cat && (t.cat!==f.cat || t.type!==f.catType)) return false;

    if(q){ const c=catOf(t.type,t.cat); if(!(`${c.name} ${t.note||''} ${amountStr(t.amount)}`.toLowerCase().includes(q))) return false; }

function viewFix(){
  const rules = S.settings.recurring.slice().sort((a,b)=> (b.active-a.active) || (monthlyEq(b)-monthlyEq(a)));
  const act = rules.filter(r=>r.active);
  const sum = type => act.filter(r=>r.type===type).reduce((s,r)=>s+monthlyEq(r),0);
  const e=sum('expense'), i=sum('income'), s=sum('save'), left=i-e-s;
  let h = `<section class="hero"><div class="cap">Feste Ausgaben pro Monat</div><div class="big2 out">${fmt(e)}</div><p class="sub">Jährliche oder vierteljährliche Zahlungen sind auf den Monat umgerechnet.</p></section>`;
  h += `<div class="panel" style="margin-top:14px"><div class="kpis"><div><span>Feste Einnahmen</span><b>${fmt(i)}</b></div><div><span>Sparpläne</span><b>${fmt(s)}</b></div><div><span>Bleibt monatlich</span><b style="color:${left<0?'var(--out)':'var(--in)'}">${left<0?MINUS:''}${fmt(Math.abs(left))}</b></div><div><span>Fixkosten im Jahr</span><b>${fmt0(e*12)}</b></div></div></div>`;

  if(dueN) h += `<p class="sub" style="margin-top:12px">Bis Monatsende werden noch ${dueN===1?'1 Zahlung':`${dueN} Zahlungen`} über ${fmt(due)} fällig.</p>`;
  h += `<section class="sec"><div class="sec-h"><h2>Wiederkehrende Buchungen</h2></div>`;
  if(!rules.length){
    h += `<div class="panel empty"><h3>Noch nichts angelegt</h3><p>Miete, Strom, Versicherungen, Gehalt oder dein Sparplan: einmal anlegen, und die App bucht sie zum Fälligkeitstag automatisch.</p><button class="btn solid" data-action="rule-new">Wiederkehrende Buchung anlegen</button></div>`;
  } else {
    for(const type of ['expense','income','save']){
      const list = rules.filter(r=>r.type===type); if(!list.length) continue;
      h += `<div class="dhead" style="margin-top:16px">${{expense:'Ausgaben',income:'Einnahmen',save:'Sparen'}[type]}</div>`;

        const cls = type==='expense'?'out':type==='income'?'in':'sv';
        h += `<button class="tx" data-action="edit-rule" data-id="${esc(r.id)}" style="${r.active?'':'opacity:.55'}"><span class="ic">${esc(c.icon)}</span><span class="m"><span class="c">${esc(r.note || c.name)}</span><span class="n">${esc(meta)}</span></span><span class="amt ${cls}">${type==='save' ? signed(r.amount) : fmt(r.amount)}</span></button>`;
      }

  }
  h += `</section>`;
  return h;

  h += `<div class="acc-val">${fmt(st.value)}</div>`;

        h += `<p class="hint" style="margin-top:8px">Trage einmal ein, wie viel du insgesamt in diesen ETF eingezahlt hast – dann zeigt die App Gewinn und Rendite richtig an. <button data-action="acc-invested" data-id="${esc(a.id)}">Jetzt eintragen</button></p>`;
      }
      if(st.move) h += `<p class="acc-move ${st.move.abs>=0?'gain':'loss'}">Seit ${dm(parse(st.move.from))}: ${signed(st.move.abs)}${st.move.pct!=null?` (${fmtPct(st.move.pct)})`:''}</p>`;

      if(st.snaps.length >= 2){
        const sn = st.snaps.slice(-60), list=r.list;
        const vals = sn.map(x=>x.value), inv = sn.map(x=>investedAt(a, x.date, list));
        if(st.pending){ vals.push(st.value); inv.push(st.invested); }
        const n=vals.length, xl=[{i:0,t:dm(parse(sn[0].date))},{i:n-1,t:st.pending?'heute':dm(parse(sn[sn.length-1].date))}];
        const series = a.base ? [{vals:inv, cls:'l-cmp'},{vals, cls:'l-sav', area:'a-sav', dot:true, dotCls:'sv'}] : [{vals, cls:'l-sav', area:'a-sav', dot:true, dotCls:'sv'}];
        h += `<div style="margin-top:8px">${svgLines(n, series, {xLabels:xl, aria:'Depotwert und Einzahlungen', fit:true})}<div class="chart-legend"><span><i class="k-bar" style="background:var(--save)"></i>Depotwert</span>${a.base?'<span><i class="k-dash"></i>Eingezahlt</span>':''}</div></div>`;
      }
    } else {
      h += `<p class="muted" style="margin:4px 0 0;font-size:14px">Bisher nur die Summe deiner Sparbuchungen. Trage den aktuellen Depotwert ein, dann siehst du Gewinn oder Verlust.</p>`;
    }
  }
  const qBtn = etf && quoteCfg().on ? `<button class="btn solid" data-action="quote" data-id="${esc(a.id)}">Kurs abrufen</button>` : '';
  h += `<div class="btn-row" style="margin-top:12px">${qBtn}<button class="btn ${qBtn?'':'solid'}" data-action="acc-update" data-id="${esc(a.id)}">${qBtn ? 'Selbst eintragen' : 'Stand aktualisieren'}</button>${r.list.length?`<button class="btn" data-action="cat-list" data-cat="${esc(a.id)}" data-type="save">Buchungen</button>`:''}</div></div>`;
  return h;
}
function viewSave(){
  const t=todayDate();
  const all = S.tx.filter(x=>x.type==='save');
  const rows = accounts().map(a=>{ const list=all.filter(x=>x.cat===a.id); return {a, list, s:accStats(a, list)}; });
  const main = rows.filter(r=> r.s.value!==0 || r.s.snaps.length || r.list.length || (!r.a.hidden && (r.a.id==='tagesgeld' || isEtf(r.a))));
  const rest = rows.filter(r=> !main.includes(r) && !r.a.hidden);
  const total = main.reduce((x,r)=>x+r.s.value,0), etfSum = main.filter(r=>isEtf(r.a)).reduce((x,r)=>x+r.s.value,0);
  let h = `<section class="hero"><div class="cap">Ersparnisse gesamt</div><div class="big2 sv">${fmt(total)}</div><p class="sub">Kontostände und Depotwerte, jeweils zum letzten eingetragenen Stand plus deine Sparbuchungen seitdem.</p></section>`;
  h += `<div class="panel" style="margin-top:14px"><div class="kpis"><div><span>Tagesgeld &amp; Konten</span><b>${fmt(total-etfSum)}</b></div><div><span>ETF &amp; Depot</span><b>${fmt(etfSum)}</b></div></div></div>`;
  h += `<section class="sec"><div class="sec-h"><h2>Deine Sparkonten</h2></div><div class="accs">${main.map(accCard).join('')}</div>`;
  if(rest.length) h += `<p class="muted" style="margin:14px 0 6px;font-size:14px">Weitere Konten ohne Guthaben:</p><div class="chips">${rest.map(r=>`<button class="chip" data-action="acc-edit" data-id="${esc(r.a.id)}">${esc(r.a.icon)} ${esc(r.a.name)}</button>`).join('')}</div>`;
  h += `<div class="btn-row" style="margin-top:16px"><button class="btn solid" data-action="add" data-type="save">Sparbetrag buchen</button><button class="btn" data-action="rule-new" data-type="save">Sparplan anlegen</button><button class="btn" data-action="acc-new">Konto hinzufügen</button></div></section>`;
  // Monat & Jahr
  const mr=rangeFor('month',t), m=totals(mr.start, mr.end), yr=rangeFor('year',t), y=totals(yr.start, yr.end);
  const rate = m.inc>0 ? Math.round(m.sav/m.inc*100) : null;
  h += `<section class="sec"><div class="sec-h"><h2>Sparleistung</h2></div><div class="panel"><div class="kpis"><div><span>Im ${MONTHS[t.getMonth()]}</span><b>${fmt(m.sav)}</b></div><div><span>Sparquote ${MONTHS[t.getMonth()]}</span><b>${rate==null?'–':rate+' %'}</b></div><div><span>Seit Jahresbeginn</span><b>${fmt(y.sav)}</b></div><div><span>Ø pro Monat ${t.getFullYear()}</span><b>${fmt(Math.round(y.sav/(t.getMonth()+1)))}</b></div></div></div></section>`;
  // Entwicklung gesamt
  if(main.some(r=>r.list.length || r.s.snaps.length)){
    const vals=[], xl=[];
    for(let k=11;k>=0;k--){ const end=new Date(t.getFullYear(), t.getMonth()-k+1, 0, 12); const e = k===0 ? todayIso() : iso(end); vals.push(main.reduce((x,r)=>x+valueAt(r.a, e, r.list),0)); const i=11-k; if(i%3===0 || i===11) xl.push({i, t:k===0?'heute':MSHORT[end.getMonth()]}); }
    h += `<section class="sec"><div class="sec-h"><h2>Entwicklung</h2><small>letzte 12 Monate</small></div><div class="panel">${svgLines(12,[{vals, cls:'l-sav', area:'a-sav', dot:true, dotCls:'sv'}],{xLabels:xl, aria:'Entwicklung der Ersparnisse'})}</div></section>`;
  }
  if(all.length) h += `<section class="sec"><div class="sec-h"><h2>Letzte Sparbuchungen</h2></div>${all.slice(0,6).map(txRow).join('')}</section>`;
  return h;
}

function openAccForm(a, focus){
  const st = a ? accStats(a) : null;
  const sb = a ? sharesBase(a, todayIso()) : null;
  F = {mode:'acc', id:a ? a.id : null, name:a ? a.name : '', icon:a ? a.icon : '🏦', kind:a ? (a.kind||'cash') : 'cash', isin:a && a.isin || '', symbol:a && a.symbol || '', cur:a && a.cur || '', date:todayIso(),
       value: st ? st.value : null, invested: st ? st.invested : null, shares: sb ? sb.shares : '', dirtyV:false, dirtyI:false, dirtyS:false};
  openSheet(accFormHtml(), 'save');
  const id = focus==='shares' ? 'acc-shares' : focus==='symbol' ? 'acc-symbol' : focus==='invested' ? 'acc-invested' : focus ? 'acc-value' : null;
  const el = id && $('#'+id);
  if(el){ el.focus({preventScroll:true}); try{ el.select(); }catch(e){} el.scrollIntoView({block:'center'}); }
}
function saveAcc(){
  if(!F || F.mode!=='acc') return;
  const etf = F.kind==='etf';
  const name = $('#acc-name').value.trim().slice(0,30) || (etf ? 'ETF-Depot' : 'Tagesgeld');
  const icon = firstChars($('#acc-icon').value.trim(),2) || (etf ? '📈' : '🏦');
  const isin = ($('#acc-isin') ? $('#acc-isin').value : '').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
  if(etf && isin && !/^[A-Z]{2}[A-Z0-9]{9}\d$/.test(isin)){ toast('Die ISIN sieht nicht vollständig aus (12 Zeichen, z. B. IE00B3YLTY66).'); return; }
  let date = $('#acc-date').value || todayIso(); if(date > todayIso()) date = todayIso();
  let value=null, invested=null, shares=NaN, price=NaN;
  if(F.dirtyV){
    value = parseMoney($('#acc-value').value, true);
    if(Number.isNaN(value)){ toast('Bitte einen gültigen Betrag eingeben, z. B. 8.240,00.'); $('#acc-value').focus(); return; }
  }
  if(etf){
    const sTxt = $('#acc-shares').value.trim(), pTxt = $('#acc-price').value.trim();
    if(F.dirtyS && sTxt){ shares = parseDecimal(sTxt); if(Number.isNaN(shares)){ toast('Bitte bei den Anteilen eine gültige Zahl eingeben, z. B. 1.024,5678.'); $('#acc-shares').focus(); return; } }
    if(pTxt){ price = parseDecimal(pTxt); if(Number.isNaN(price)){ toast('Bitte beim Kurs eine gültige Zahl eingeben, z. B. 11,71.'); $('#acc-price').focus(); return; } }
    if(shares>0 && value==null){
      value = price>0 ? Math.round(shares*price*100) : F.value;
      if(value==null){ toast('Bitte zusätzlich den Kurs oder den Depotwert eintragen.'); $('#acc-price').focus(); return; }
    }
  }
  let symbol = '';
  if(etf && $('#acc-symbol')){ symbol = cleanSymbol($('#acc-symbol').value); if($('#acc-symbol').value.trim() && !symbol){ toast('Das Börsenkürzel enthält ungültige Zeichen.'); return; } }
  if(etf && F.dirtyI){
    invested = parseMoney($('#acc-invested').value, true);
    if(Number.isNaN(invested)){ toast('Bitte beim eingezahlten Betrag eine gültige Zahl eingeben.'); $('#acc-invested').focus(); return; }
  }
  const dup = accounts().find(x=>x.id!==F.id && !x.hidden && x.name.toLowerCase()===name.toLowerCase());
  if(dup){ toast('Ein Konto mit diesem Namen gibt es schon.'); return; }
  let a = F.id ? accById(F.id) : null;
  if(!a){ a = {id:'k-'+newId().replace(/-/g,'').slice(0,10), name, icon, kind:F.kind, snaps:[]}; accounts().push(a); }
  a.name=name; a.icon=icon; a.kind=F.kind;
  if(etf && isin) a.isin=isin; else delete a.isin;
  if(!etf){ delete a.base; delete a.symbol; delete a.cur; }
  else if($('#acc-symbol')){
    if(symbol){
      const picked = !!F.cur && F.symbol===symbol;
      if(picked) a.cur = F.cur; else if(symbol!==a.symbol) delete a.cur;
      a.symbol = symbol;
    } else { delete a.symbol; delete a.cur; }
  }
  const at = date===todayIso() ? Date.now() : endOfDayTs(date);
  if(value!=null){
    const sn={date, at, value};
    if(etf && shares>0){ sn.shares=shares; if(price>0) sn.price=price; }
    else if(etf){ const same=(a.snaps||[]).find(x=>x.date===date); if(same && same.shares>0) sn.shares=same.shares; }
    a.snaps = (a.snaps||[]).filter(x=>x.date!==date); a.snaps.push(sn); a.snaps.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
  }
  if(invested!=null) a.base = {date, at, invested};
  const isNew = !F.id;
  Store.saveSettings(); closeSheet(); render();
  toast(isNew ? 'Sparkonto angelegt' : value!=null ? 'Stand gespeichert' : 'Gespeichert');
}

/* ---------- Eingabe-Sheet ---------- */
let F = null;
function openSheet(html, type){
  const sh=$('#sheet'), sc=$('#scrim');
  sh.innerHTML = `<div class="grab"></div>` + html; sh.dataset.type = type||'expense';
  sh.hidden=false; sc.hidden=false; document.body.classList.add('locked');
  requestAnimationFrame(()=>{ sh.classList.add('open'); sc.classList.add('open'); });
  sh.scrollTop = 0;
}
function closeSheet(){
  const sh=$('#sheet'), sc=$('#scrim');
  sh.classList.remove('open'); sc.classList.remove('open'); document.body.classList.remove('locked'); if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  setTimeout(()=>{ if(!sh.classList.contains('open')){ sh.hidden=true; sc.hidden=true; sh.innerHTML=''; } }, 280);
  F = null;
}

function openRuleForm(rule, preset={}){
  F = rule ? {mode:'rule', id:rule.id, type:rule.type, amount:Math.abs(rule.amount), dir:rule.amount<0?'out':'in', cat:rule.cat, date:rule.start, note:rule.note||'', freq:rule.freq, end:rule.end||'', active:rule.active!==false}
           : {mode:'rule', id:null, type:preset.type||'expense', amount:0, dir:'in', cat:null, date:todayIso(), note:'', freq:'monthly', end:'', active:true};
  openSheet(formHtml(), F.type);
}
function readForm(){
  const v = id => { const el=$('#'+id); return el ? el.value : ''; };
  F.amount = parseAmount(v('f-amount'));
  F.date = v('f-date') || todayIso();
  F.note = v('f-note').trim().slice(0,120);
  if($('#f-freq')) F.freq = v('f-freq');
  if($('#f-end')) F.end = v('f-end');
  if($('#f-rec')) F.rec = $('#f-rec').checked;
  if($('#f-active')) F.active = $('#f-active').checked;
}
async function submitForm(){
  if(!F || F.mode==='acc') return;
  readForm();
  if(!(F.amount>0)){ toast('Bitte einen gültigen Betrag eingeben, z. B. 12,50.'); $('#f-amount')?.focus(); return; }
  const amount = F.type==='save' && F.dir==='out' ? -F.amount : F.amount;
  const cat = F.cat || FALLBACK[F.type];
  const end = F.end && F.end >= F.date ? F.end : null;
  const t = todayIso();
  if(F.mode==='rule'){
    if(F.id){
      const r = S.settings.recurring.find(x=>x.id===F.id); if(!r){ closeSheet(); return; }
      const wasActive = r.active;
      Object.assign(r, {type:F.type, amount, cat, note:F.note, freq:F.freq, start:F.date, end, active:F.active});
      if(F.active && !wasActive) r.until = t;
    } else {
      S.settings.recurring.push({id:newId(), type:F.type, amount, cat, note:F.note, freq:F.freq, start:F.date, end, active:true, until:null});
    }
    closeSheet(); render(); Store.saveSettings(); toast('Gespeichert');
    setTimeout(runRecurring, 900); return;
  }
  // Einzelbuchung
  let ruleId = F.recurringId;
  if(F.rec && !ruleId){
    ruleId = newId();
    S.settings.recurring.push({id:ruleId, type:F.type, amount, cat, note:F.note, freq:F.freq, start:F.date, end, active:true, until: (F.id || F.date <= t) ? F.date : null});
  }
  if(F.rec && F.date > t && !F.id){
    closeSheet(); render(); await Store.saveSettings(); toast(`Wiederkehrende Buchung angelegt, erste am ${dmy(parse(F.date))}`); return;
  }
  const tx = {id: F.id || (ruleId && F.rec ? `r-${ruleId}-${F.date}` : newId()), type:F.type, amount, cat, date:F.date, note:F.note, created:F.created||Date.now()};
  if(ruleId) tx.recurringId = ruleId;
  const i = S.tx.findIndex(x=>x.id===tx.id); if(i>=0) S.tx[i]=tx; else S.tx.push(tx);
  sortTx();
  const editing = !!F.id, madeRule = F.rec && !F.recurringId;
  closeSheet(); render();
  Store.putTx(tx);
  toast(editing ? 'Änderungen gespeichert' : `${TYPE_NAME[tx.type]} gespeichert`);
  if(madeRule) setTimeout(runRecurring, 900);
}
async function deleteFromForm(btn){
  if(!F || !F.id) return;
  if(!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent = F.mode==='rule' ? 'Wirklich löschen? Bisherige Einträge bleiben erhalten.' : 'Wirklich löschen?'; return; }
  if(F.mode==='rule'){
    const old = S.settings.recurring.find(r=>r.id===F.id);
    S.settings.recurring = S.settings.recurring.filter(r=>r.id!==F.id);
    closeSheet(); render(); Store.saveSettings();
    toast('Wiederkehrende Buchung gelöscht', 'Rückgängig', ()=>{ if(old && !S.settings.recurring.some(r=>r.id===old.id)){ S.settings.recurring.push(old); Store.save(); render(); toast('Wiederhergestellt'); } });
  } else {
    const id=F.id, old=S.tx.find(x=>x.id===id); S.tx = S.tx.filter(x=>x.id!==id);
    closeSheet(); render(); Store.delTx(id);
    toast('Buchung gelöscht', 'Rückgängig', ()=>{ if(old && !S.tx.some(x=>x.id===old.id)){ S.tx.push(old); sortTx(); Store.save(); render(); toast('Buchung wiederhergestellt'); } });
  }
}

function openSettings(){ F=null; openSheet(settingsHtml(), 'expense'); }
function refreshSettings(){ const sh=$('#sheet'); const top=sh.scrollTop; sh.innerHTML = `<div class="grab"></div>` + settingsHtml(); sh.scrollTop = top; }
function offerFile(filename, data, label){
  const type = filename.endsWith('.csv') ? 'text/csv' : 'application/json';
  // iPhone: Teilen-Menü mit „In Dateien sichern“ (muss direkt aus dem Tippen heraus starten)
  try{
    for(const t of [type, 'text/plain']){
      const file = new File([data], filename, {type:t});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        return navigator.share({files:[file]}).then(()=>'saved', e => (e && e.name==='AbortError') ? 'declined' : showText(data,label));
      }
    }
  }catch(e){}
  if(IS_IOS && STANDALONE) return Promise.resolve(showText(data,label));
  try{
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type})); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    return Promise.resolve('saved');
  }catch(e){}
  return Promise.resolve(showText(data,label));
}
function showText(data,label){
  if(!$('#out-box')){ openSettings(); }
  const box=$('#out-box');
  if(box){ box.innerHTML = `<p class="muted" style="margin:14px 0 0">Speichern als Datei ist hier nicht möglich. Kopiere den Text und lege ihn sicher ab (${esc(label)}).</p><textarea class="csv-out" readonly>${esc(data)}</textarea>`; box.scrollIntoView({block:'nearest'}); }
  return 'shown';
}
function csvData(){
  // Formel-Injektion in Excel verhindern: Texte, die mit = + - @ beginnen, werden entschärft
  const safe = v => /^[=+\-@\t\r]/.test(v) ? "'"+v : v;
  const q = v => { v=String(v??''); return /[;"\r\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const rows=[['Datum','Typ','Kategorie','Betrag','Notiz','Wiederkehrend']];
  for(const t of S.tx.slice().reverse()){
    const amt = t.type==='expense' ? -t.amount : t.amount;
    rows.push([dmy(parse(t.date)), TYPE_NAME[t.type], safe(catOf(t.type,t.cat).name), (amt/100).toFixed(2).replace('.',','), safe(t.note||''), t.recurringId?'ja':'']);
  }
  return '\ufeff' + rows.map(r=>r.map(q).join(';')).join('\r\n');
}
async function exportCsv(){
  const r = await offerFile(`haushaltsbuch-${todayIso()}.csv`, csvData(), 'CSV');
  if(r==='saved') toast('Export gespeichert');
}
async function backup(){
  const now = new Date();
  const data = JSON.stringify({app:'haushaltsbuch', version:2, exported:now.toISOString(), tx:S.tx, settings:S.settings});
  const r = await offerFile(`haushaltsbuch-sicherung-${todayIso()}-${pad(now.getHours())}${pad(now.getMinutes())}.json`, data, 'Sicherung');
  if(r==='saved'){ S.meta.lastBackup = Date.now(); S.meta.changes = -1; Store.save(); if($('#out-box')) refreshSettings(); render(); toast('Sicherung erstellt'); }
}
async function importData(text){
  let d;
  try{ d = JSON.parse(String(text||'').replace(/^\uFEFF/,'')); }catch(e){ toast('Die Datei ist keine gültige Sicherung.'); return; }
  if(!d || typeof d!=='object' || !Array.isArray(d.tx)){ toast('Die Datei ist keine gültige Sicherung.'); return; }
  const tx = cleanTxList(d.tx), set = normalizeSettings(d.settings);
  if(!tx.length && !set.recurring.length){ toast('In der Sicherung wurden keine Buchungen gefunden.'); return; }
  // Zusammenführen: nichts Vorhandenes wird gelöscht oder überschrieben
  await Store.snapshot('Vor dem Einlesen einer Sicherung');
  const byId = new Map(S.tx.map(t=>[t.id,t])); let added=0;
  for(const t of tx){ if(!byId.has(t.id)){ byId.set(t.id, t); added++; } }
  S.tx = [...byId.values()]; sortTx();
  for(const k of TYPES) for(const c of set.categories[k]){
    const loc = S.settings.categories[k].find(x=>x.id===c.id);
    if(!loc){ S.settings.categories[k].push(c); continue; }
    if(k!=='save') continue;
    const empty = !(loc.snaps||[]).length && !loc.base;
    if(empty){ loc.kind=c.kind; loc.name=c.name; loc.icon=c.icon; }
    const have = new Set((loc.snaps||[]).map(x=>x.date));
    const extra = (c.snaps||[]).filter(x=>!have.has(x.date));
    if(extra.length) loc.snaps = [...(loc.snaps||[]), ...extra].sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
    if(!loc.base && c.base) loc.base = c.base;
    if(!loc.isin && c.isin) loc.isin = c.isin;
  }
  let rules=0; for(const r of set.recurring) if(!S.settings.recurring.some(x=>x.id===r.id)){ S.settings.recurring.push(r); rules++; }
  if(!Store.save()) return;
  refreshSettings(); render(); runRecurring();
  toast(`Sicherung eingelesen: ${added} neue Buchung${added===1?'':'en'}${rules?`, ${rules} Fixkosten`:''}`);
}
async function wipe(btn){
  if(!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.style.paddingLeft=''; btn.style.textAlign=''; btn.textContent='Wirklich alles löschen? Tippe erneut.'; return; }
  await Store.snapshot('Vor dem Löschen aller Daten');
  S.tx = []; S.settings = defaultSettings(); S.meta = {lastBackup:0, changes:0};
  try{ localStorage.removeItem(QKEY); }catch(e){}
  Store.save();
  closeSheet(); render(); toast('Alle Daten gelöscht – unter Einstellungen wiederherstellbar');
}
async function restoreRescue(btn){
  const r = Store.rescue; if(!r) return;
  if(!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent='Aktuellen Stand ersetzen? Tippe erneut.'; return; }
  const cur = Store.payload();
  Store.apply(r); Store.save();
  await IDB.set('rescue', {...cur, reason:'Vor dem Wiederherstellen', at:Date.now()}); Store.rescue = await IDB.get('rescue');
  refreshSettings(); render(); runRecurring(); toast('Stand wiederhergestellt');
}
async function dropRescue(){ await IDB.del('rescue'); Store.rescue = null; refreshSettings(); toast('Notfall-Stand endgültig entfernt'); }

/* ---------- Toast ---------- */
let toastT=0, toastFn=null;
function toast(msg, actionLabel, fn){
  const t=$('#toast'); t.textContent=msg; toastFn = fn || null;
  if(fn){ const b=document.createElement('button'); b.className='undo'; b.type='button'; b.textContent=actionLabel; b.dataset.action='toast-undo'; t.appendChild(b); }
  t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>{ t.classList.remove('show'); toastFn=null; const u=t.querySelector('.undo'); if(u) u.remove(); }, fn ? 6000 : Math.min(9000, Math.max(2600, String(msg).length*60)));
}

  'acc-sym-search'(el){ searchSymbol(el); },
  'acc-sym-pick'(el){ $('#acc-symbol').value = el.dataset.sym; F.symbol = el.dataset.sym; F.cur = el.dataset.cur || ''; $('#acc-sym-results').innerHTML = `<p class="muted" style="margin:8px 0 0;font-size:14px">Ausgewählt: <b>${esc(el.dataset.sym)}</b>${F.cur?` (${esc(F.cur)})`:''}. Zum Übernehmen unten speichern.</p>`; },
  'q-key-save'(){ const k=$('#q-key').value.trim(); if(k && !/^[A-Za-z0-9]{6,64}$/.test(k)){ toast('Der Schlüssel sieht nicht richtig aus (nur Buchstaben und Ziffern).'); return; } setQuoteCfg({on:true, key:k}); refreshSettings(); render(); toast(k ? 'Schlüssel gespeichert' : 'Schlüssel entfernt'); },
  'acc-snap-del'(el){
    const a = F && accById(F.id); if(!a) return;
    if(!el.classList.contains('armed')){ el.classList.add('armed'); el.textContent='Löschen?'; el.style.fontSize='14px'; el.style.color='var(--out)'; return; }
    a.snaps = (a.snaps||[]).filter(x=>x.date!==el.dataset.date);
    Store.saveSettings(); render(); openAccForm(a); toast('Stand gelöscht');
  },
  'acc-hide'(el){
    const a = F && accById(F.id); if(!a) return;
    if(!a.hidden && !el.classList.contains('armed')){ el.classList.add('armed'); el.textContent='Ausblenden? Buchungen bleiben erhalten.'; return; }
    if(a.hidden) delete a.hidden; else a.hidden = true;
    Store.saveSettings(); closeSheet(); render(); toast(a.hidden ? 'Konto ausgeblendet' : 'Konto wieder eingeblendet');
  }
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]'); if(!el) return;
  if(!Store.ready){ e.preventDefault(); return; }
  const fn = A[el.dataset.action]; if(fn){ e.preventDefault(); fn(el, e); }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !$('#sheet').hidden) closeSheet();
  if(e.key==='Enter' && F && Store.ready && e.target && (e.target.id==='f-amount' || e.target.id==='f-note')){ e.preventDefault(); submitForm(); }
  if(e.key==='Enter' && F && F.mode==='acc' && Store.ready && e.target && /^acc-/.test(e.target.id || '')){ e.preventDefault(); saveAcc(); }
});
document.addEventListener('input', e=>{
  if(F && F.mode==='acc'){
    const id=e.target.id;
    if(id==='acc-value') F.dirtyV = true;
    if(id==='acc-invested') F.dirtyI = true;
    if(id==='acc-shares') F.dirtyS = true;
    if(id==='acc-symbol') F.cur = '';
    if(id==='acc-shares' || id==='acc-price'){
      const sh=parseDecimal($('#acc-shares').value), pr=parseDecimal($('#acc-price').value);
      if(sh>0 && pr>0){ $('#acc-value').value = amountIn(Math.round(sh*pr*100)); F.dirtyV = true; }
    }
  }
  if(e.target.id==='q'){ S.ui.f.q = e.target.value; S.ui.limit=150; const l=$('#txlist'); if(l) l.innerHTML = txListHtml(); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='f-rec' && F){ F.rec = e.target.checked; $('#f-recopts').hidden = !F.rec; }
  if(e.target.id==='q-on'){ const q=quoteCfg(); setQuoteCfg({on:e.target.checked, key:q.key}); refreshSettings(); render(); }
  if(e.target.id==='imp-file' && e.target.files && e.target.files[0]){
    const f = e.target.files[0]; e.target.value = '';
    if(f.size > 20*1024*1024){ toast('Die Datei ist zu groß für eine Sicherung.'); return; }
    const rd = new FileReader(); rd.onload = () => importData(rd.result); rd.onerror = () => toast('Die Datei konnte nicht gelesen werden.'); rd.readAsText(f);
  }
});
let shownToday = todayIso();
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible') return;
  const t = todayIso();
  if(t !== shownToday){ if(inRange(rangeFor(S.ui.unit, S.ui.anchor), parse(shownToday))) S.ui.anchor = todayDate(); shownToday = t; }
  runRecurring(); render();
});
if('serviceWorker' in navigator && window.isSecureContext && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});

Store.init();
</script>
</body>
</html>
